# Credential data for the login and authentication tests.
#
# There are deliberately NO valid credentials in this file. A shared real
# account would make tests order-dependent - one test's password change or
# account deletion would break another - and would put a working credential in
# version control. Valid accounts are instead generated per test by the
# registered_account fixture, which creates a unique one and deletes it after.
#
# Every record carries an explicit expected_result / expected_status, per the
# constraint in ARCHITECTURE.md section 4.
#
# Addresses use example.com (reserved for documentation) and the .invalid TLD
# (reserved as never-resolvable), so no record here can reach a real inbox.

# The message the site shows for any failed login. It deliberately does not
# distinguish "no such user" from "wrong password" - that is correct security
# behaviour, so the tests assert the two are indistinguishable.
login_error_message: "Your email or password is incorrect!"

# --- UI login failures -------------------------------------------------
invalid_logins:
  - id: unknown-email
    description: An address with no account behind it.
    email: no-such-user@qavigil.invalid
    password: irrelevant-password
    expected_result: rejected
    expected_message: "Your email or password is incorrect!"

  - id: wrong-password-format
    description: A plausible address with a clearly wrong password.
    email: someone.else@example.com
    password: not-the-right-password
    expected_result: rejected
    expected_message: "Your email or password is incorrect!"

  - id: sql-injection-attempt
    description: >-
      Injection payload in the email field, deliberately formatted so it is a
      *valid* email address and therefore actually reaches the server. An
      earlier version used "' OR '1'='1" with spaces, which the email input's
      native HTML5 validation rejected before submission - so the test proved
      only that the browser validates, never that the server resists
      injection. Expected to be turned away as an ordinary bad credential.
    email: "admin'OR'1'='1--@example.com"
    password: "' OR '1'='1"
    expected_result: rejected
    expected_message: "Your email or password is incorrect!"

# --- inputs the browser refuses to submit at all ------------------------
# These never reach the server, so there is no server error to assert on.
# The expected behaviour is that nothing happens: no session, no navigation.
client_validation_rejections:
  - id: malformed-email
    description: An email field value that is not a valid address.
    email: "not-an-email-address"
    password: "any-password"
    expected_result: blocked_before_submit
    expected_behavior: >-
      The browser's native validation stops the form submitting, so no error
      message is rendered and no session is created.

  - id: injection-string-with-spaces
    description: >-
      The classic injection string. Contains spaces, so it is not a valid
      email and the browser blocks it client-side.
    email: "' OR '1'='1"
    password: "' OR '1'='1"
    expected_result: blocked_before_submit
    expected_behavior: >-
      The browser's native validation stops the form submitting, so no error
      message is rendered and no session is created.

# --- API verifyLogin, incomplete payloads ------------------------------
api_login_payloads:
  - id: email-missing
    description: Password supplied without an email.
    payload:
      password: some-password
    expected_status: 400
    expected_behavior: The API reports a bad request rather than authenticating.

  - id: password-missing
    description: Email supplied without a password.
    payload:
      email: someone@example.com
    expected_status: 400
    expected_behavior: The API reports a bad request rather than authenticating.

  - id: both-missing
    description: An entirely empty payload.
    payload: {}
    expected_status: 400
    expected_behavior: The API reports a bad request rather than authenticating.

# --- API verifyLogin, complete but wrong --------------------------------
api_invalid_credentials:
  - id: unknown-account
    description: A well-formed request for an account that does not exist.
    email: no-such-user@qavigil.invalid
    password: irrelevant-password
    expected_status: 404
    expected_message: "User not found!"

# --- fixed fields used when registering throwaway accounts --------------
# The identifying fields (name, email, password, address) are generated by
# Faker per test; these are the ones that must be constant because the site
# validates them against its own lists.
account_defaults:
  title: Mr
  country: India
  birth_date: "1"
  birth_month: "1"
  birth_year: "1990"

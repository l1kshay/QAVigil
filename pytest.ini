[pytest]
# Put the project root on sys.path so tests can import config/, pages/ and
# api_clients/ without any per-file path juggling.
pythonpath = .

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --strict-config
    -ra
    --color=yes
    --alluredir=reports/allure-results
    # Each run starts from an empty results directory. Without this, results
    # accumulate across runs, and because retries are correlated by historyId,
    # the same test from two separate runs looks like one flaky test with a
    # retry - which silently corrupts the analytics export. CI gets a fresh
    # checkout anyway; this makes local runs behave the same way.
    --clean-alluredir
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: fast, high-value checks that must pass on every push
    regression: the full suite, run on pull requests and on a schedule

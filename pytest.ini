[pytest]
# Put the project root on sys.path so tests can import config/, pages/ and
# api_clients/ without any per-file path juggling.
pythonpath = .

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --strict-config
    -ra
    --color=yes

markers =
    smoke: fast, high-value checks that must pass on every push
    regression: the full suite, run on pull requests and on a schedule
